# yaml-language-server: $schema=https://raw.githubusercontent.com/j4th/hapi-factory/075659bf64448052e7b4b74e53d3d1ca3cf70885/policy/schemas/repo-overlay.schema.json
#
# hapi-sandbox-fortune's overlay on hapi-factory's central policy (hapi-factory spec §7).
# It may only tighten that policy, and .factory/** is itself protected.
#
# The gates' own config: `mise run check` runs Biome, Bun and tsc with these
# files, so a worker that could edit one could pass `check` by loosening it;
# and an osv-scanner.toml could ignore a vulnerability (the gates pass
# OSV-Scanner a config of their own, but `mise run scan` reads this one).
# Same modes as AGENTS.md: the maintainer approves in an interactive session;
# unattended sessions and workers may not edit them.
protected_paths:
  "**/biome.json*": { interactive: ask, unattended: deny, workers: deny }
  "**/bunfig.toml": { interactive: ask, unattended: deny, workers: deny }
  "**/tsconfig*.json": { interactive: ask, unattended: deny, workers: deny }
  "**/osv-scanner.toml": { interactive: ask, unattended: deny, workers: deny }

# The sandbox's own settings (hapi-factory docs/runbooks/engine.md, "End to end on the sandbox").
# A month's spend on this repo stops at $15, under the central $25.
budgets:
  repo_monthly_usd: 15
# The smoke test's stub service: the central bun-http sidecar serves smoke/bakery/ (its server.ts and
# fortunes.json), which the overlay makes a path workers may not write.
sidecar:
  name: bun-http
  data_dir: smoke/bakery
# Already the central default: Ready to merge needs the work order's acceptance tests to exist and pass.
runs:
  phases:
    require_acceptance: true
